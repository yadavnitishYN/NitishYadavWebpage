  <text x="172" y="382" fill="#91bbff" font-size="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif">Verifying correctness in replicated and concurrent systems.</text>
  <rect x="172" y="448" width="500" height="82" rx="41" fill="none" stroke="#4675b8" stroke-width="2"/><text x="422" y="502" fill="#9cc4ff" font-size="40" text-anchor="middle" font-family="JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace">State-based CRDTs</text>
