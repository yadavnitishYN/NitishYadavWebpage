  <g stroke="#30415a" stroke-width="2" fill="none" opacity="0.62"><line x1="1130" y1="184" x2="1290" y2="145"/><line x1="1290" y1="145" x2="1418" y2="246"/><line x1="1130" y1="184" x2="1220" y2="322"/><line x1="1220" y1="322" x2="1418" y2="246"/><line x1="1220" y1="322" x2="1336" y2="448"/></g>
