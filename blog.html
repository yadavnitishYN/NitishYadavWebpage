    :root {

    .header-sticky {
      position: sticky;
      top: 0;

    .nav-link-custom {
      color: #000;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.3s;
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      font-variant: small-caps;
    }

    .nav-link-custom:hover { color: var(--red-primary); }
    .nav-link-custom.active { text-decoration: underline; text-underline-offset: 4px; }

    .hero-gradient {
      background: linear-gradient(135deg, var(--red-primary) 0%, var(--red-secondary) 100%);

    .btn-circle {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 1.2rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-circle:hover {
      background: var(--red-secondary);
      color: #fff;
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .btn-circle::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translate(-50%, 4px);
      background: #111827;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: .01em;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.1s ease, transform 0.1s ease;
      z-index: 20;
    }

    .btn-circle::before {
      content: "";
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #111827;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.1s ease;
      z-index: 20;
    }

    .btn-circle:hover::after,
    .btn-circle:hover::before {
      opacity: 1;
      visibility: visible;
    }

    .btn-circle:hover::after { transform: translate(-50%, 0); }

    .mobile-menu-btn { display: none; }

    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
      .desktop-nav { display: none; }

    }

    @media (min-width: 769px) {
      .mobile-nav { display: none !important; }

<script>
(function(){
  var list = document.getElementById('blogFullList');
  var empty = document.getElementById('blogFullEmpty');
  if(!list || typeof loadBlogPosts === 'undefined') return;
  loadBlogPosts(function(posts){
    if(!posts.length){ empty.hidden = false; return; }
    empty.hidden = true;
    posts.forEach(function(post){
      var item = document.createElement('article');
      item.className = 'blog-full-item';
      var dateStr = new Date(post.date).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
      var mediaHtml = post.previewImage
        ? '<div class="blog-full-media"><img src="' + post.previewImage + '" alt="' + (post.previewAlt || post.title) + '" loading="eager"></div>'
        : '';
      item.innerHTML = mediaHtml +
        '<div class="blog-full-body">' +
          '<div class="blog-full-title"><a href="' + post.url + '">' + post.title + '</a></div>' +
          '<div class="blog-full-date">' + dateStr + '</div>' +
          '<p class="blog-full-abstract">' + post.abstract + '</p>' +
        '</div>';
      list.appendChild(item);
    });
  });
})();
</script>
<script>
function toggleMobileMenu(){
  const mobileNav=document.getElementById('mobileNav');
  const btn=document.querySelector('.mobile-menu-btn');
  if(!mobileNav)return;
  mobileNav.classList.toggle('show');
  if(btn)btn.setAttribute('aria-expanded', mobileNav.classList.contains('show') ? 'true' : 'false');
}
document.addEventListener('click',function(event){
  const mobileNav=document.getElementById('mobileNav');
  const mobileBtn=document.querySelector('.mobile-menu-btn');
  if(mobileNav&&mobileBtn&&!mobileNav.contains(event.target)&&!mobileBtn.contains(event.target)){
    mobileNav.classList.remove('show'); mobileBtn.setAttribute('aria-expanded','false');
  }
});
document.querySelectorAll('a[href*="#"]').forEach(anchor=>{
  anchor.addEventListener('click',function(e){
    const href=this.getAttribute('href');
    if(!href || href.startsWith('http') || (href.includes('.html') && !href.startsWith('index.html#'))) return;
    const id=href.includes('#') ? '#'+href.split('#')[1] : href;
    const target=document.querySelector(id);
    if(target){e.preventDefault(); const headerOffset=70; const y=target.getBoundingClientRect().top+window.pageYOffset-headerOffset; window.scrollTo({top:y,behavior:'smooth'});}
    const mobileNav=document.getElementById('mobileNav'); if(mobileNav)mobileNav.classList.remove('show');
  });
});
(function(){
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('.nav-link-custom[data-section]'));
  if(!navLinks.length) return;
  var pageDefaults = { '': 'home', 'index.html': 'home', 'teaching.html': 'teaching', 'publication.html': 'publications', 'blog.html': 'blog' };
  var path = window.location.pathname.split('/').pop();
  var defaultSection = pageDefaults[path] || 'home';

  function setActive(section){
    navLinks.forEach(function(link){
      link.classList.toggle('active', link.getAttribute('data-section') === section);
    });
  }

  var sectionIds = ['home','research','publications','blog','education','teaching'];
  var sections = sectionIds.map(function(id){ return document.getElementById(id); }).filter(Boolean);

  if(!sections.length){ setActive(defaultSection); return; }

  var headerOffset = 96;
  var ticking = false;

  function updateActive(){
    ticking = false;
    var doc = document.documentElement;
    var atBottom = (window.innerHeight + window.pageYOffset) >= (doc.scrollHeight - 2);
    var current = null;
    if(atBottom){
      current = sections[sections.length - 1].id;
    } else {
      for(var i = 0; i < sections.length; i++){
        if(sections[i].getBoundingClientRect().top <= headerOffset){
          current = sections[i].id;
        }
      }
    }
    setActive(current || defaultSection);
  }

  function onScroll(){
    if(!ticking){
      window.requestAnimationFrame(updateActive);
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  updateActive();
})();
(function(){
  var lu = document.getElementById('last-updated');
  if(lu){
    try {
      var d = new Date(document.lastModified);
      lu.textContent = isNaN(d.getTime()) ? document.lastModified : d.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
    } catch(e){ lu.textContent = document.lastModified; }
  }
})();
</script>
